[package]
name = "lan-drop"
version = "0.1.0"
description = "LAN file transfer between Windows and iPhone"
edition = "2021"

[lib]
name = "lan_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
local-ip-address = "0.6"
qrcode = "0.14"
rcgen = { version = "0.14", features = ["x509-parser"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23.45", features = ["ring"] }
time = { version = "0.3.55", features = ["formatting", "local-offset"] }
idevice = { version = "0.1.68", features = ["usbmuxd", "afc", "pair", "house_arrest", "installation_proxy"] }
tauri-plugin-dialog = "2.8.0"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
