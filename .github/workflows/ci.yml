name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Release-please PRs are version/CHANGELOG bumps only; GITHUB_TOKEN
    # already keeps them from triggering CI, but a manual branch update
    # (synchronize) would. github.head_ref is empty on push/dispatch, so
    # those still run.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (biome, strict)
        run: npm run lint

      # Also produces dist/, which tauri::generate_context! embeds at compile
      # time — must run before any cargo step.
      - name: Typecheck and build frontend
        run: npm run build

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked
        working-directory: src-tauri

  gitleaks:
    # Full-history secret scan (all commits, hence fetch-depth: 0).
    # Personal repo, so no GITLEAKS_LICENSE required. Runs in parallel
    # with the Windows build job and fails the workflow on any finding.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
